<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Basic Selectors</title>
  <style>
    p {
      color: red;
      font-size: 16px;
      line-height: 1.5;
    }
    .highlight {
      background-color: yellowgreen;
      padding: 6px 10px;
      border-radius: 4px;
    }
    #main {
      color:gainsboro;
      font-size: 24px;
      border-bottom: 2px solid blue;
    }
  </style>
</head>
<body>
  <h1 id="main">Targeted by ID Selector (#main-title)</h1>
  <p>Standard paragraph targeted by the Element Selector (p).</p>
  <p class="highlight">Paragraph targeted by the Class Selector (.highlight).</p>
</body>
</html>
