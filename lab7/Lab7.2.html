<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Group, Universal, and Descendant Selectors</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    h1, p {
      color: rebeccapurple;
      margin-bottom: 12px;
    }
    div p {
      color: gold;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <h1>Grouped Heading (h1, p)</h1>
  <p>Standard paragraph styled by the group selector.</p>

  <div>
    <span>
      <p>Paragraph inside a div — styled by the descendant selector.</p>
    </span>
  </div>
</body>
</html>
