<!DOCTYPE html>
<html>
<head>
    <title>Student Registration</title>
</head>

<body>

<form>

<h1>Student Registration</h1>

<table>

<tr>
    <td>FullName</td>
    <td>
        <input type="text" name="fullname"
               pattern="[A-Za-z ]{3,50}"
               required>
    </td>
</tr>

<tr>
    <td>Email</td>
    <td>
        <input type="email" name="email" required>
    </td>
</tr>

<tr>
    <td>Mobile No</td>
    <td>
        <input type="tel" name="mobile"
               pattern="[0-9]{10}"
               required>
    </td>
</tr>

<tr>
    <td>Address</td>
    <td>
        <textarea name="address" rows="6" cols="25"
                  required></textarea>
    </td>
</tr>

<tr>
    <td>Nationality</td>
    <td>
        <input type="text" name="nationality" required>
    </td>
</tr>

<tr>
    <td>Date Of Birth</td>
    <td>
        <input type="date" name="dob" required>
    </td>
</tr>

<tr>
    <td>Gender</td>
    <td>
        <input type="radio" name="gender"
               value="Male" required> Male

        <input type="radio" name="gender"
               value="Female"> Female
    </td>
</tr>

<tr>
    <td>Highest Degree</td>
    <td>
        <select name="degree" required>
            <option value="">Select Degree</option>
            <option>BCA</option>
            <option>B.Sc</option>
            <option>B.E.</option>
            <option>B.Tech</option>
            <option>MCA</option>
            <option>M.Tech</option>
        </select>
    </td>
</tr>

<tr>
    <td>CPI</td>
    <td>
        <input type="number" name="cpi"
               min="0" max="10"
               step="0.01" required>
    </td>
</tr>

<tr>
    <td>University</td>
    <td>
        <input type="text" name="university" required>
    </td>
</tr>

<tr>
    <td>Passing Year</td>
    <td>
        <select name="year" required>
            <option value="">Select Your Passing Year</option>
            <option>2024</option>
            <option>2025</option>
            <option>2026</option>
            <option>2027</option>
            <option>2028</option>
        </select>
    </td>
</tr>

<tr>
    <td></td>
    <td>
        <input type="submit" value="Submit">
        <input type="reset" value="Cancel">
    </td>
</tr>

</table>

</form>

</body>
</html>
