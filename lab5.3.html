<!DOCTYPE html>
<html>
<head>
    <title> Account</title>
</head>

<body>

<form>

    <h1>Create Account</h1>

    <table>

        <tr>
            <td>First name *</td>
            <td>Last name</td>
        </tr>

        <tr>
            <td>
                <input type="text"
                       name="fname"
                       placeholder="enter your first name"
                       required
                       pattern="[A-Za-z ]{2,30}">
            </td>

            <td>
                <input type="text"
                       name="lname"
                       placeholder="enter your last name"
                       pattern="[A-Za-z ]{2,30}">
            </td>
        </tr>

        <tr>
            <td colspan="2">Email *</td>
        </tr>

        <tr>
            <td colspan="2">
                <input type="email"
                       name="email"
                       placeholder="enter your email"
                       required>
            </td>
        </tr>

        <tr>
            <td>Password *</td>
            <td>Confirm Password *</td>
        </tr>

        <tr>
            <td>
                <input type="password"
                       name="password"
                       placeholder="enter your password"
                       required
                       minlength="8">
            </td>

            <td>
                <input type="password"
                       name="confirm"
                       placeholder="enter your password again"
                       required
                       minlength="8">
            </td>
        </tr>

        <tr>
            <td>Gender:</td>
            <td>Hobbies</td>
        </tr>

        <tr>
            <td>
                <input type="radio" name="gender" value="Male">
                Male

                <input type="radio" name="gender" value="Female">
                Female
            </td>

            <td>
                <input type="checkbox" name="hobby" value="Music">
                Music

                <input type="checkbox" name="hobby" value="Sports">
                Sports

                <input type="checkbox" name="hobby" value="Travel">
                Travel

                <input type="checkbox" name="hobby" value="Movies">
                Movies
            </td>
        </tr>

        <tr>
            <td>Source of Income</td>
            <td>Income</td>
        </tr>

        <tr>
            <td>
                <select name="income_source">
                    <option>Employed</option>
                    <option>Business</option>
                    <option>Student</option>
                    <option>Unemployed</option>
                </select>
            </td>

            <td>
                <input type="range"
                       name="income"
                       min="0"
                       max="200000"
                       value="20000">

                20K
            </td>
        </tr>

        <tr>
            <td>Upload Profile Picture</td>
            <td>Age</td>
        </tr>

        <tr>
            <td>
                <input type="file"
                       name="profile"
                       accept="image/*">
            </td>

            <td>
                <input type="number"
                       name="age"
                       value="18"
                       min="1"
                       max="100"
                       required>
            </td>
        </tr>

        <tr>
            <td colspan="2">Bio</td>
        </tr>

        <tr>
            <td colspan="2">
                <textarea name="bio"
                          rows="5"
                          cols="60"
                          placeholder="Write something about yourself"></textarea>
            </td>
        </tr>

        <tr>
            <td></td>
            <td>
                <input type="submit" value="Create">
            </td>
        </tr>

    </table>

</form>

</body>
</html>
